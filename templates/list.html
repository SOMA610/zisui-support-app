{% extends "base.html" %}

{% block contents %}

<div class="card p-3">

    <p>閲覧したいレシピを選んでください:</p>

    <form method="GET" action="{{ url_for('index') }}"class="search-form mb-5">
        <input
            type="text"
            name="keyword"
            value="{{ keyword }}"
            placeholder="料理名・食材で検索"
            class="input search-keyword"
        >
    <div class="select">
        <select name="sort" class="input">
            <option value="title">料理名順</option>
            <option value="easy_asc">難易度が低い順</option>
            <option value="easy_desc">難易度が高い順</option>
        </select>
    </div>
    
        <input type="submit" value="検索・並び替え" class="button is-info">
        <a href="{{ url_for('index') }}" class="button is-light">クリア</a>
    </form>

    <div class="mb-4" style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <a href="{{ url_for('shopping') }}" class="button is-info">
            🛒 買い物リスト
        </a>
        <span class="has-text-grey">
            レシピの食材を登録して、買い忘れを防ぐ
        </span>
    </div>

    <p>
        <a href="{{ url_for('memo', id=0) }}" class="button is-primary">
            ＋ 新規作成
        </a>
    </p>

    {% if items %}
        <ul class="recipe-list">
            {% for it in items %}
                <li class="recipe-item">
                    <a href="{{ url_for('memo', id=it.id) }}" class="recipe-link">
                       <span class="recipe-title">
                           🥄 {{ it.title }}
                         </span>

                        <span class="recipe-easy">
                            難易度：{{ "★" * it.easy }}{{ "☆" * (5 - it.easy) }}
                        </span>
                    </a>
                </li>
              
            {% endfor %}
        </ul>
    {% else %}
        <p>該当するレシピはありません。</p>
    {% endif %}

</div>

{% endblock %}
