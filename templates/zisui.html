{% extends "base.html" %}

{% block contents %}
<div class="card">
    <div class="card-content">

        <!-- 保存用フォーム -->
        <form method="POST">

            <div class="field">
                <label class="label" for="title">料理名:</label>
                <div class="control">
                    <input
                        id="title"
                        name="title"
                        type="text"
                        value="{{ it.title }}"
                        class="input"
                    >
                </div>
            </div>

            <div class="field">
                <label class="label" for="recipe">レシピ:</label>
                <div class="control">
                    <textarea
                        id="recipe"
                        name="recipe"
                        class="textarea"
                    >{{ it.recipe }}</textarea>
                </div>
            </div>

            <div class="field">
                <label class="label" for="food">食材:</label>
                <div class="control">
                    <textarea
                        id="food"
                        name="food"
                        class="textarea"
                    >{{ it.food }}</textarea>
                </div>
            </div>

            <div class="field">
                <label class="label" for="easy">難易度:</label>
                <div class="control">
                    <div class="select is-fullwidth">
                        <select id="easy" name="easy">
                            <option value="1"
                                {% if it.easy == 1 %}selected{% endif %}>
                                1（簡単）
                            </option>

                            <option value="2"
                                {% if it.easy == 2 %}selected{% endif %}>
                                2
                            </option>

                            <option value="3"
                                {% if it.easy == 3 %}selected{% endif %}>
                                3
                            </option>

                            <option value="4"
                                {% if it.easy == 4 %}selected{% endif %}>
                                4
                            </option>

                            <option value="5"
                                {% if it.easy == 5 %}selected{% endif %}>
                                5（難しい）
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="field mt-5">
                <div class="control">
                    <input
                        type="submit"
                        value="保存"
                        class="button is-primary"
                    >
                </div>
            </div>

        </form>

        <!-- 削除用フォーム -->
        {% if it.id %}
        <form
            method="POST"
            action="{{ url_for('delete_memo', id=it.id) }}"
            class="mt-3"
        >
            <input
                type="submit"
                value="削除"
                class="button is-danger"
            >
        </form>
        {% endif %}

    </div>
</div>
{% endblock %}
